# Ultra-simplified Cloudflare tunnel configuration for Discord verification
# Based on successful tests with simple HTTP server

ingress:
  # Single rule for all traffic - forward everything to the verification server
  - hostname: "*"
    service: http://127.0.0.1:8001
    originRequest:
      noTLSVerify: true
      disableChunkedEncoding: true  # Try disabling chunked encoding
      connectTimeout: 30s  # Increase connection timeout
      tlsTimeout: 30s      # Increase TLS timeout
      tcpKeepAlive: 30s   # Enable TCP keepalive
      headers:
        Host: ["127.0.0.1:8001"]

  # Default catch-all rule - must be the last rule
  - service: http_status:404
