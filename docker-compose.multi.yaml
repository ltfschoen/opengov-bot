version: '3.1'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.multi
    restart: always
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - db
      - web
    environment:
      - USE_POLKADOT_JS=true
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=bot/utils/polkadot_auth.py
      - FLASK_ENV=development
    restart: unless-stopped

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
