# Add this to your nginx configuration to fix Discord signature header issues

# IMPORTANT: Add the following to your main nginx.conf file in the http block:
# --------------------------------------------------------------------
# http {
#     # Your existing http settings...
#     
#     # Increase header buffer size to handle large signatures
#     large_client_header_buffers 4 64k;
# }
# --------------------------------------------------------------------

# Then add the following to your site-specific config in /etc/nginx/sites-available/

# In your server block that handles the Discord interactions:
server {
    # Your existing server settings...
    
    # Preserve original headers exactly as received
    underscores_in_headers on;
    
    # Discord interaction endpoint with header preservation
    location /api/interactions {

        proxy_method $request_method;
        
        # Pass all headers without modification
        proxy_pass_request_headers on;
        
        # Don't allow nginx to modify headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important! Preserve the original header case
        # Discord uses X-Signature-Ed25519 and nginx might lowercase this
        proxy_pass_header X-Signature-Ed25519;
        proxy_pass_header X-Signature-Timestamp;
        
        # Set buffer sizes to avoid truncation
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Your existing proxy config
        proxy_pass http://127.0.0.1:8001;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings (Discord needs quick responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
