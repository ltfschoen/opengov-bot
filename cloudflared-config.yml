# Cloudflare tunnel configuration reference
# This file is for reference only - quick tunnels use command line arguments

# For quick tunnels, use: cloudflared tunnel --url http://127.0.0.1:8001

# For named tunnels with more complex routing, use this configuration:
tunnel: your-tunnel-name
ingress:
  # IPv4 specific mapping for /api/interactions
  - hostname: "*"
    service: http://127.0.0.1:8001
    path: /api/interactions
    originRequest:
      noTLSVerify: true
  
  # IPv6 specific mapping for /api/interactions
  - hostname: "*"
    service: http://[::1]:8001
    path: /api/interactions
    originRequest:
      noTLSVerify: true
  
  # IPv4 fallback for all other paths
  - hostname: "*"
    service: http://127.0.0.1:8001
    originRequest:
      noTLSVerify: true
      
  # IPv6 fallback for all other paths
  - hostname: "*"
    service: http://[::1]:8001
    originRequest:
      noTLSVerify: true
